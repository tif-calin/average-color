<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Average Color</title>
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <link href="style.css" rel="stylesheet" inline>

    <!-- SEO stuff -->
    <meta name="description" content="Paste or upload and image and get the average color of the pixels.">
    <meta name="keywords" content="PWA, tool, image">
    <meta name="author" content="Thomas Rettig">
    <link rel="canonical" href="https://tif-calin.github.io/average-color/">
    <meta name="og:title" content="Average Color">
    <meta name="og:type" content="website">
    <meta name="og:url" content="https://tif-calin.github.io/average-color/">
    <meta name="og:image" content="https://tif-calin.github.io/average-color/og-image.png">

    <!-- PWA stuff -->
    <meta name="theme-color" content="#008080">
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
  </head>
  <body>
    <header>
      <h1>Average Color</h1>
      <p>A tool to find the average color in an image.</p>
    </header>
    <main id="target">
      <label for="upload" id="upload-label">Drop/paste images here (or click to upload)</label>
      <input type="file" id="upload" aria-labelledby="upload-label" accept="image/png, image/jpeg, image/gif, image/jpg" multiple>
    </main>
    <!--PWA install prompt-->
    <aside>
      <button id="add-btn">Add to home</button>
    </aside>
    <!--Output-->
    <section id="images"></section>
    <!--Script begins-->
    <script>
      // register our service worker
      if (navigator && navigator.serviceWorker) {
        navigator.serviceWorker.register("sw.js");
      }

      let deferredPrompt;
      const addBtn = document.getElementById("add-btn");
      addBtn.style.display = "none";

      window.addEventListener("beforeinstallprompt", (e) => {
        // Prevent Chrome 67 and earlier from automatically showing the prompt
        e.preventDefault();
        // Stash the event so it can be triggered later.
        deferredPrompt = e;
        // Update UI to notify the user they can add to home screen
        addBtn.style.display = "block";

        addBtn.addEventListener("click", (e) => {
          // hide our user interface that shows our A2HS button
          addBtn.style.display = "none";
          // Show the prompt
          deferredPrompt.prompt();
          // Wait for the user to respond to the prompt
          deferredPrompt.userChoice.then((choiceResult) => {
            deferredPrompt = null;
          });
        });
      });
    </script>
    <script src="average-color.js" inline></script>
  </body>
</html>
